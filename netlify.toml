[build]
command = "npm run build"
publish = "dist"

# Omega OAuth callback relay (added 2026-09-06).
# Vendors such as Slack refuse plain-HTTP loopback redirect URLs, so Omega
# registers https://plugins.omega2ai.com/oauth/<profile_id>/callback with each
# provider and this rule hands the browser straight back to the desktop app's
# loopback listener, query string intact (Netlify forwards it by default).
# Nothing is stored or logged here: the authorization code that passes through
# is bound to that device's PKCE verifier and state, and the token exchange
# never touches this site.
[[redirects]]
from = "/oauth/:profile_id/callback"
to = "http://127.0.0.1:13310/oauth/:profile_id/callback"
status = 302
force = true

[[redirects]]
from = "/privacy.html"
to = "/privacy/"
status = 301
force = true

[[redirects]]
from = "https://www.omega2ai.com/*"
to = "https://omega2ai.com/:splat"
status = 301
force = true

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/oauth/*"
[headers.values]
Referrer-Policy = "no-referrer"
Cache-Control = "no-store"
