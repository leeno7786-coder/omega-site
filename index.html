<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omega AI LLC — Autonomous Cognitive Architecture</title>
    <meta
      name="description"
      content="Omega AI LLC builds autonomous AI systems. Omega 3.0 is a metacognitive runtime with episodic memory, deterministic cognition loops, and evidence-grounded motor learning."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Crawlable for Google OAuth verification (must exist in static HTML, not only after JS). -->
    <link rel="privacy-policy" href="https://omega2ai.com/privacy" />
  </head>
  <body>
    <form name="project-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" />
      <input name="email" type="email" />
      <input name="company" />
      <select name="category">
        <option>Metacognitive or agentic AI</option>
        <option>Custom AI runtime, local AI, or edge AI</option>
        <option>Website, web application, or Android application</option>
        <option>Custom computer, Linux, or hardware integration</option>
        <option>Unsure or another type of project</option>
      </select>
      <textarea name="description"></textarea>
      <input name="bot-field" />
    </form>
    <div id="root"></div>
    <footer class="static-legal-footer" aria-label="Legal">
      <span>Omega AI LLC</span>
      <nav aria-label="Legal navigation">
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a>
      </nav>
    </footer>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
