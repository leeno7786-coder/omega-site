<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>NanoAI beta request registration</title>
  </head>
  <body>
    <p>Request a NanoAI beta place on the NanoAI page.</p>
    <form name="nanoai-beta" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="nanoai-beta" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="company" />
      <textarea name="use"></textarea>
      <input name="windows" />
      <input name="processor" />
      <input name="graphics" />
      <input name="memory" />
      <input name="disk" />
      <input name="consent" type="checkbox" value="yes" />
      <input name="bot-field" />
    </form>
  </body>
</html>
