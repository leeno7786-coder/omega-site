<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>NanoAI bug report registration</title>
  </head>
  <body>
    <p>Submit bug reports from Report a bug in NanoAI Settings.</p>
    <form name="nanoai-bug-report" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="nanoai-bug-report" />
      <input name="reference" />
      <input name="area" />
      <input name="subject" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
